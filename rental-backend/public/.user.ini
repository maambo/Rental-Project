; Landlord application and property forms can post up to ~25MB across
; several document/image uploads in a single request. PHP's defaults
; (upload_max_filesize=2M, post_max_size=8M) reject that before it
; reaches our own 5MB-per-file validation, so raise the ceiling here.
upload_max_filesize = 30M
post_max_size = 30M
max_file_uploads = 20
